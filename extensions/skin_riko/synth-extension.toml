schema = 1

[extension]
id = "official/skin_riko"
name = "Riko (skin)"
version = "0.1.0"
description = "Riko, the fox-eared digital person of Rayen (VRM model by Little Forest)."
author = "XargonWan"

[compat]
core_api = ">=0.1,<1"

# A skin is files only: no process runs. SyntH copies the folder into its skins directory
# while the extension is installed and on, and removes it again on uninstall.
[[provides.skins]]
name = "Riko"
type = "vrm"
path = "skin"
